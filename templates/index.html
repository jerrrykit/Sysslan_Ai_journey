<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Journey Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <header>
            <h1>AI Journey <span>Predictor</span></h1>
            <p>Powered by Random Forest Machine Learning</p>
        </header>

        <div class="glass-panel main-panel">
            <form id="prediction-form">
                <div class="input-group">
                    <label for="distance">Total Distance (km)</label>
                    <input type="number" id="distance" name="distance" placeholder="e.g. 500" required step="any">
                </div>
                
                <div class="input-group">
                    <label for="stops">Number of Stops</label>
                    <input type="number" id="stops" name="stops" placeholder="e.g. 5" required>
                </div>

                <div class="input-group">
                    <label for="start_time">Start Time (Minutes from Midnight)</label>
                    <input type="number" id="start_time" name="start_time" placeholder="e.g. 600 (for 10:00 AM)" required step="any">
                </div>

                <div class="input-group">
                    <label for="end_time">End Time (Minutes from Midnight)</label>
                    <input type="number" id="end_time" name="end_time" placeholder="e.g. 900 (for 3:00 PM)" required step="any">
                </div>

                <button type="submit" id="predict-btn">
                    <span class="btn-text">Calculate Duration</span>
                    <div class="spinner hidden" id="loading-spinner"></div>
                </button>
            </form>
        </div>

        <div class="glass-panel result-panel hidden" id="result-container">
            <h2>Predicted Duration</h2>
            <div class="prediction-value">
                <span id="prediction-result">0</span> 
                <span class="unit">Minutes</span>
            </div>
            <p class="hours-conversion" id="hours-result"></p>
            <button class="reset-btn" id="reset-btn">Make Another Prediction</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
